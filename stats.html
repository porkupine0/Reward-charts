<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedtime Stats</title>
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bedtime Stats">
<link rel="apple-touch-icon" href="icons/stats.png">
<link rel="icon" href="icons/stats.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <nav class="top"><a href="./" class="back">&larr; All charts</a><span id="sync" class="sync">Connecting…</span></nav>
  <header class="head">
    <p class="eyebrow">For Mom &amp; Dad</p>
    <h1>Bedtime Stats</h1>
  </header>
  <div class="weeknav">
    <button id="prev" class="navbtn" aria-label="Previous week">&lsaquo;</button>
    <div><strong id="weeklabel"></strong><button id="thisweek" class="linkbtn" hidden>Back to this week</button></div>
    <button id="next" class="navbtn" aria-label="Next week">&rsaquo;</button>
  </div>
  <div id="summary" class="statsum"></div>
  <div id="kids"></div>
  <p class="note"><b>On time</b> = the kid tapped Stop at or before his lights-out time. <b>Steps</b> = bedtime boxes checked. Times come from the Start/Stop timer on each kid's checklist.</p>
</main>
<script type="module" src="stats.js"></script>
</body>
</html>
