<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eli's Reward Chart</title>
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eli's Chart">
<link rel="apple-touch-icon" href="icons/eli.png">
<link rel="icon" href="icons/eli.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-chart="eli">
<main class="wrap">
  <nav class="top"><a href="./" class="back">&larr; All charts</a><span class="navlinks"><a href="run.html" class="pillbtn">Today's run &rarr;</a><span id="sync" class="sync">Connecting…</span></span></nav>
  <header class="head">
    <p id="eyebrow" class="eyebrow"></p>
    <h1>Earn the Reward</h1>
  </header>
  <div class="weeknav">
    <button id="prev" class="navbtn" aria-label="Previous week">&lsaquo;</button>
    <div><strong id="weeklabel"></strong><button id="thisweek" class="linkbtn" hidden>Back to this week</button></div>
    <button id="next" class="navbtn" aria-label="Next week">&rsaquo;</button>
  </div>
  <div class="progress"><div class="track"><div id="bar" class="fill"></div></div><span id="progress"></span></div>
  <div id="grid" class="grid"></div>
  <section id="weeklycard" class="card reward">
    <h2>Perfect week reward</h2>
    <p id="weeklystatus" class="status"></p>
    <div id="weekly" class="picks"></div>
    <label class="given"><input type="checkbox" id="given"> Reward given (parent)</label>
  </section>
  <section id="monthcard" class="card month">
    <div class="month-left"><h2 id="monthname">Monthly prize</h2><div id="circles" class="circles"></div></div>
    <div class="month-right"><p id="monthlystatus" class="status"></p><div id="monthly" class="picks"></div></div>
  </section>
  <p id="note" class="note"></p>
</main>
<script type="module" src="weekly.js"></script>
</body>
</html>
