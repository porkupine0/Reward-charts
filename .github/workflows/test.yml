name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        run: for f in *.js; do node --check "$f"; done
      - name: Date, schedule and scoring tests
        run: node --test tests/*.test.mjs
  browser:
    # The browser tests (a stand-in for Firebase, never the real database), separate from the unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser/run.mjs
